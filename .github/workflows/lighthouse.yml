name: Lighthouse CI
on:
  deployment_status:

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One run: analyzes both pages, checks the minimum scores in lighthouserc.json on both, keeps the reports.
      - name: Run Lighthouse and check scores
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}
            ${{ github.event.deployment_status.target_url }}/adopter
          configPath: ./lighthouserc.json
          uploadArtifacts: true
